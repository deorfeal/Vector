<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="css/aos.css" />
        <link rel="stylesheet" href="css/swiper.css" />
        <link rel="stylesheet" href="css/style.min.css" />
</head>

<body>

    <div class="big-wrapper">
        <header class="header">
            <div class="container">
                <div class="header__inner">
                    <div class="header__burger burger" data-aos="fade-down">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <a class="header__logo logo" href="#" data-aos="fade-down">
                        <img src="images/logo.svg" alt="img">
                    </a>
                    <nav class="header__menu menu">
                        <ul class="menu__list menu-list" data-aos="fade-down">
                            <li class="menu-list__item">
                                <a class="menu-list__link" href="#">
                                    About
                                </a>
                            </li>
                            <li class="menu-list__item">
                                <a class="menu-list__link" href="#">
                                    Products
                                </a>
                            </li>
                            <li class="menu-list__item">
                                <a class="menu-list__link" href="#">
                                    Affiliate Program
                                </a>
                            </li>
                            <li class="menu-list__item">
                                <a class="menu-list__link" href="#">
                                    Blog
                                </a>
                            </li>
                            <li class="menu-list__item">
                                <a class="menu-list__link" href="#">
                                    Contact
                                </a>
                            </li>
                        </ul>
                    </nav>
                    <div class="header__wrapper" data-aos="fade-down">
                        <a class="header__link btn btn--blue" href="#">
                            Book a Demo
                        </a>
                    </div>
                </div>
            </div>
        </header>
        <div class="wrapper">
            <main class="main">
                <div class="main__grid main-grid">
                    <img src="images/main-grid.svg" alt="gid">
                </div>
                <div class="main__error error">
                    <div class="container">
                        <div class="error__bg error__bg--left">
                            <img src="images/404-bg-left.svg" alt="bg" data-aos="fade-right">
                        </div>
                        <div class="error__bg error__bg--right">
                            <img src="images/404-bg-right.svg" alt="bg" data-aos="fade-left">
                        </div>
                        <div class="error__inner">
                            <div class="error__wrapper">
                                <h1 class="error__title" data-aos="zoom-out">
                                    404
                                </h1>
                                <p class="error__text" data-aos="zoom-out">
                                    OOPS, no such page was found.
                                    We suggest you go to the main page
                                </p>
                                <div class="error__icons error-icons">
                                    <div class="error-icons__icon">
                                        <img src="images/404-icon.svg" alt="icon" data-aos="zoom-in">
                                    </div>
                                    <div class="error-icons__icon">
                                        <img src="images/404-icon.svg" alt="icon" data-aos="zoom-in">
                                    </div>
                                    <div class="error-icons__icon">
                                        <img src="images/404-icon.svg" alt="icon" data-aos="zoom-in">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/jquery.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/swiper.js"></script>
    <script src="js/main.min.js"></script>
</body>

</html>
